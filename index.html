<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title> Rababi</title>
    <link rel="icon" type="jfif" href="images/rabab.jfif">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Galindo&display=swap" rel="stylesheet">
</head>

<body>

    <nav class="top">
        <ul class="brand">
            <li class="brandImage"> <img src="images/rabab.jfif"> </li>
            <li class="name">Rababii</li>
        </ul>
    </nav>

    <div class="mainBox">
        <div class="searchPanel">
            <h2>Search Music</h2>
            <form id="searchForm" class="searchForm">
                <input type="text" id="searchInput" placeholder="Search a song ...">
                <button type="submit">Search</button>
            </form>
            <div class="searchResults" id="searchResults"></div>
        </div>

        <div class="playlistPanel">
            <div class="playlistTabs" id="playlistTabs">
                <button id="newPlaylistBtn" class="tabBtn newPlaylistBtn" type="button">+ New Playlist</button>
            </div>

            <h1 id="playlistTitle">Playlist</h1>
            <div class="playlist" id="playlist"></div>
        </div>
    </div>


    <div class="buttom">
        <input type="range" name="range" id="progressbar" value="0" min="0" max="100"> <span
            class="timeline">00:00</span>

        <div class="songName">
            <img src="images/gif.gif" alf="gif" id="gif">
            <span class="nameViewport"><span class="nameText"></span></span>
        </div>

        <ul class="icons">
            <li class="backStep icon"> <img src="icons/backward-solid-full.svg" alt="backStep" id="backStep" width="25">
            </li>
            <li class="backword icon"> <img src="icons/backward-step.svg" alt="backward" id="backward" width="25"></li>
            <li class="play icon"> <img src="icons/play-solid-full.svg" alt="play" id="playIcon" width="25"> </li>
            <li class="forward icon"> <img src="icons/forward-step.svg" alt="forward" id="forward" width="25"></li>
            <li class="nextStep icon"> <img src="icons/forward-solid-full.svg" alt="nextStep" id="nextStep" width="25">
            </li>
        </ul>
        <div class="soundBar xicon">
            <label>volume</label>
            <input type="range" name="soundBar" id="soundBar" min="0" max="100">
        </div>
    </div>
    </div>

    <div class="modalOverlay" id="modalOverlay">
        <div class="modalBox" id="modalBox">
            <h3 id="modalTitle"></h3>
            <div id="modalBody"></div>
            <div class="modalActions">
                <button type="button" id="modalCancelBtn">Cancel</button>
                <button type="button" id="modalConfirmBtn">Confirm</button>
            </div>
        </div>
    </div>

    <script src="rababi.js"></script>
</body>

</html>
